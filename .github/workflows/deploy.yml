name: Deploy to Compute Engine

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: production
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ vars.GCP_PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Set up Google Cloud CLI
              uses: google-github-actions/setup-gcloud@v3

            - name: Deploy selected commit
              env:
                  DEPLOY_SHA: ${{ github.sha }}
                  DEPLOYMENT_METHOD: ${{ vars.DEPLOYMENT_METHOD }}
                  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
                  GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
                  GCE_ZONE: ${{ vars.GCE_ZONE }}
                  GCE_APP_PATH: ${{ vars.GCE_APP_PATH }}
                  GCE_SSH_USER: ${{ vars.GCE_SSH_USER }}
                  GCE_USE_IAP: ${{ vars.GCE_USE_IAP }}
              run: bash ci/deploy-compute-engine.sh
