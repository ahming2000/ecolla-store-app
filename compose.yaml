name: ecolla-store-app

x-sail-environment: &sail-environment
    WWWUSER: '${WWWUSER:-1000}'
    LARAVEL_SAIL: 1
    XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
    XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
    IGNITION_LOCAL_SITES_PATH: '${PWD}'
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: 5432
    DB_DATABASE: '${DB_DATABASE:-ecolla_store_app}'
    DB_USERNAME: '${DB_USERNAME:-ecolla_app}'
    DB_PASSWORD: '${DB_PASSWORD:-password}'
    VITE_PORT: '${VITE_PORT:-5173}'

x-sail-service: &sail-service
    build:
        context: ./vendor/laravel/sail/runtimes/8.4
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-1000}'
            NODE_VERSION: 24
            POSTGRES_VERSION: 18
    image: sail-8.4/ecolla-store-app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment: *sail-environment
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
    depends_on:
        pgsql:
            condition: service_healthy

services:
    laravel.test:
        <<: *sail-service
        ports:
            - '${APP_PORT:-80}:80'

    vite:
        <<: *sail-service
        command: npm run dev -- --host 0.0.0.0
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    queue:
        <<: *sail-service
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

    pgsql:
        image: postgres:18-alpine
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-ecolla_store_app}'
            POSTGRES_USER: '${DB_USERNAME:-ecolla_app}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - -q
                - -d
                - '${DB_DATABASE:-ecolla_store_app}'
                - -U
                - '${DB_USERNAME:-ecolla_app}'
            interval: 5s
            timeout: 5s
            retries: 12

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
